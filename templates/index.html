<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Precedent</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 750px; margin: 40px auto; padding: 0 20px; }
        h2 { margin-top: 40px; }
        textarea, input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px; margin-top: 8px; }
        textarea { height: 90px; }
        button { margin-top: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
        .box { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px; }
    </style>
</head>
<body>
    <h1> Precedent</h1>
    <p>An on-call assistant that remembers every past incident.</p>

    <h2>1. Report a new incident</h2>
    <textarea id="incident" placeholder="e.g. checkout service throwing 500s, pool exhausted"></textarea>
    <button onclick="diagnose()">Diagnose</button>
    <div class="box" id="response">Answer will appear here.</div>

    <h2>2. Save a resolved incident to memory</h2>
    <input id="desc" placeholder="What happened?">
    <input id="cause" placeholder="Root cause">
    <input id="fix" placeholder="Fix that worked">
    <button onclick="saveIncident()">Save to memory</button>
    <div class="box" id="saveStatus">Nothing saved yet.</div>

    <script>
        async function diagnose() {
            const out = document.getElementById("response");
            out.innerText = "Searching memory and thinking... (this can take 30-60 seconds)";
            try {
                const res = await fetch("/diagnose", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ incident: document.getElementById("incident").value })
                });
                if (!res.ok) { out.innerText = "Error: " + await res.text(); return; }
                const data = await res.json();
                out.innerHTML = marked.parse(data.response);
            } catch (err) { out.innerText = "Request failed: " + err; }
        }

        async function saveIncident() {
            const out = document.getElementById("saveStatus");
            out.innerText = "Saving...";
            try {
                const res = await fetch("/resolve", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        description: document.getElementById("desc").value,
                        root_cause: document.getElementById("cause").value,
                        fix: document.getElementById("fix").value
                    })
                });
                if (!res.ok) { out.innerText = "Error: " + await res.text(); return; }
                const data = await res.json();
                out.innerText = data.status;
            } catch (err) { out.innerText = "Request failed: " + err; }
        }
    </script>
</body>
</html>
