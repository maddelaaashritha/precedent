<!DOCTYPE html>
<html>
<head>
    <title>Precedent</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 50px auto; padding: 0 20px; }
        textarea { width: 100%; height: 100px; font-size: 16px; padding: 10px; }
        button { margin-top: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #response { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🔍 Precedent</h1>
    <p>Describe a new incident:</p>
    <textarea id="incident" placeholder="e.g. checkout service throwing 500s, pool exhausted"></textarea>
    <br>
    <button onclick="diagnose()">Diagnose</button>
    <div id="response"></div>

    <script>
        async function diagnose() {
            const incident = document.getElementById("incident").value;
            document.getElementById("response").innerText = "Thinking...";
            const res = await fetch("/diagnose", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ incident: incident })
            });
            const data = await res.json();
            document.getElementById("response").innerText = data.response;
        }
    </script>
</body>
</html>
